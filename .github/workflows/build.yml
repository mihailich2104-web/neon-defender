name: Build NeonDefender Setup.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame numpy pyinstaller pillow

      - name: Build exe with PyInstaller
        shell: bash
        run: |
          if [ -f icon.ico ]; then
            pyinstaller --onefile --noconsole --name NeonDefender --icon=icon.ico game.py
          else
            echo "icon.ico not found, building without custom icon"
            pyinstaller --onefile --noconsole --name NeonDefender game.py
          fi

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Write Inno Setup script
        shell: bash
        run: |
          if [ -f icon.ico ]; then
            ICON_LINE="SetupIconFile=icon.ico"
            ICON_FILE_LINE='Source: "icon.ico"; DestDir: "{app}"; Flags: ignoreversion'
            ICON_ARG='; IconFilename: "{app}\icon.ico"'
          else
            ICON_LINE=""
            ICON_FILE_LINE=""
            ICON_ARG=""
          fi
          cat > installer.iss << EOF
          [Setup]
          AppName=Neon Defender
          AppVersion=1.0
          DefaultDirName={autopf}\NeonDefender
          DefaultGroupName=Neon Defender
          OutputBaseFilename=Setup
          OutputDir=dist_installer
          Compression=lzma
          SolidCompression=yes
          $ICON_LINE

          [Files]
          Source: "dist\NeonDefender.exe"; DestDir: "{app}"; Flags: ignoreversion
          $ICON_FILE_LINE

          [Icons]
          Name: "{group}\Neon Defender"; Filename: "{app}\NeonDefender.exe"$ICON_ARG
          Name: "{autodesktop}\Neon Defender"; Filename: "{app}\NeonDefender.exe"$ICON_ARG
          EOF

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: NeonDefender-Setup
          path: dist_installer/Setup.exe
